name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches: [ main, experimental ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test backend and generated Bash scripts
        env:
          DATA_DIR: ${{ runner.temp }}/auditorr-test-data
        run: |
          python3 -m venv "$RUNNER_TEMP/auditorr-test-venv"
          "$RUNNER_TEMP/auditorr-test-venv/bin/pip" install -r requirements.txt pytest
          "$RUNNER_TEMP/auditorr-test-venv/bin/python" -m pytest -q backend_tests

      # arm64 emulation for the runtime stage (pure-Python deps, so no
      # compilation happens under QEMU — see the frontend note in Dockerfile).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
